<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng Điều Khiển Quản Trị — CINEVA</title>
  <meta name="description" content="Quản trị nội dung CINEVA: thống kê, quản lý phim, người dùng và cài đặt.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23e2354f'/%3E%3Cstop offset='.5' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M26 20l18 12-18 12z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script src="assets/js/theme.js"></script>
  <script>
    // Bảo vệ trang admin — kiểm tra đăng nhập
    (() => {
      const KEY = "cineva_admin_auth";
      try {
        const auth = JSON.parse(localStorage.getItem(KEY));
        if (!auth || !auth.loggedIn) {
          location.href = "login.html";
        }
      } catch { location.href = "login.html"; }
    })();
  </script>
</head>
<body data-page="admin" class="page-fade">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a class="logo" href="index.html" style="margin-bottom:1.8rem">
        <span class="logo-mark"><i class="fa-solid fa-clapperboard"></i></span>
        <span class="s-text">CINEVA</span>
      </a>
      <nav aria-label="Menu quản trị">
        <button class="admin-nav-btn active" data-tab="dashboard"><i class="fa-solid fa-gauge"></i><span class="s-text">Tổng quan</span></button>
        <button class="admin-nav-btn" data-tab="movies"><i class="fa-solid fa-film"></i><span class="s-text">Quản lý phim</span></button>
        <button class="admin-nav-btn" data-tab="users"><i class="fa-solid fa-users"></i><span class="s-text">Người dùng</span></button>
        <button class="admin-nav-btn" data-tab="settings"><i class="fa-solid fa-gear"></i><span class="s-text">Cài đặt</span></button>
      </nav>
      <div style="margin-top:auto">
        <a class="admin-nav-btn" href="index.html" style="text-decoration:none"><i class="fa-solid fa-arrow-left"></i><span class="s-text">Về trang chủ</span></a>
      </div>
    </aside>

    <div class="admin-main">
      <div class="admin-topbar">
        <h1 id="admin-title" style="font-size:1.4rem;font-family:var(--font-display)">Tổng quan</h1>
        <div style="display:flex;align-items:center;gap:.8rem">
          <button class="btn btn-icon" data-theme-toggle aria-label="Chuyển giao diện"><i class="fa-solid fa-moon"></i></button>
          <button class="btn btn-icon" id="admin-logout" title="Đăng xuất" style="color:var(--crimson)"><i class="fa-solid fa-right-from-bracket"></i></button>
          <span class="avatar-btn" id="admin-avatar" aria-hidden="true">A</span>
        </div>
      </div>
      <div id="admin-content"></div>
    </div>
  </div>

  <script src="assets/js/movies.js"></script>
  <script src="assets/js/watchlist.js"></script>
  <script src="assets/js/history.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
