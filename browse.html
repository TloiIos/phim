<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khám Phá Phim — Lọc Theo Thể Loại, Quốc Gia, Năm | CINEVA</title>
  <meta name="description" content="Duyệt và lọc kho phim CINEVA theo thể loại, quốc gia, năm phát hành, điểm đánh giá và chất lượng. Tìm bộ phim hoàn hảo cho bạn.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23e2354f'/%3E%3Cstop offset='.5' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M26 20l18 12-18 12z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script src="assets/js/theme.js"></script>
</head>
<body data-page="browse" class="page-fade">
  <header class="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1 class="display-title">Khám phá <span class="text-gradient">kho phim</span></h1>
        <p>Lọc theo thể loại, quốc gia, năm phát hành và nhiều hơn nữa.</p>
      </div>
    </section>

    <div class="container">
      <div class="filter-bar reveal in-view" aria-label="Bộ lọc phim">
        <div class="filter-row">
          <div class="filter-group">
            <label for="f-genre">Thể loại</label>
            <select class="form-control" id="f-genre"></select>
          </div>
          <div class="filter-group">
            <label for="f-country">Quốc gia</label>
            <select class="form-control" id="f-country"></select>
          </div>
          <div class="filter-group">
            <label for="f-year">Năm</label>
            <select class="form-control" id="f-year"></select>
          </div>
          <div class="filter-group">
            <label for="f-rating">Điểm tối thiểu</label>
            <select class="form-control" id="f-rating">
              <option value="">Tất cả</option>
              <option value="9">9.0+</option>
              <option value="8">8.0+</option>
              <option value="7">7.0+</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="f-quality">Chất lượng</label>
            <select class="form-control" id="f-quality">
              <option value="">Tất cả</option>
              <option value="4K">4K</option>
              <option value="HD">HD</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="f-type">Loại phim</label>
            <select class="form-control" id="f-type">
              <option value="">Tất cả</option>
              <option value="movie">Phim lẻ</option>
              <option value="series">Phim bộ</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="f-sort">Sắp xếp</label>
            <select class="form-control" id="f-sort">
              <option value="">Mặc định</option>
              <option value="newest">Mới nhất</option>
              <option value="rating">Điểm cao</option>
              <option value="popular">Phổ biến</option>
              <option value="az">Tên A-Z</option>
            </select>
          </div>
          <div class="filter-actions">
            <button class="btn btn-primary" id="filter-apply"><i class="fa-solid fa-filter"></i> Lọc phim</button>
            <button class="btn btn-glass" id="filter-reset"><i class="fa-solid fa-rotate-left"></i> Đặt lại</button>
          </div>
        </div>
      </div>

      <p class="result-count" id="result-count" aria-live="polite"></p>
      <div class="movie-grid" id="browse-grid" style="margin-bottom:4rem"></div>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="assets/js/movies.js"></script>
  <script src="assets/js/watchlist.js"></script>
  <script src="assets/js/history.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/search.js"></script>
</body>
</html>
