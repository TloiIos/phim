<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập — CINEVA</title>
  <meta name="description" content="Đăng nhập vào tài khoản CINEVA để đồng bộ danh sách phim và lịch sử xem.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23e2354f'/%3E%3Cstop offset='.5' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M26 20l18 12-18 12z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script src="assets/js/theme.js"></script>
</head>
<body data-page="login" class="page-fade">
  <header class="site-header"></header>

  <main class="auth-page">
    <div class="auth-card reveal in-view">
      <a class="logo" href="index.html" style="justify-content:center;margin-bottom:.6rem">
        <span class="logo-mark"><i class="fa-solid fa-clapperboard"></i></span>
        <span>CINEVA</span>
      </a>
      <h1 style="text-align:center;font-family:var(--font-display);font-size:1.7rem;margin-bottom:.4rem">Chào mừng trở lại</h1>
      <p style="text-align:center;color:var(--text-3);margin-bottom:1.8rem">Đăng nhập để tiếp tục hành trình điện ảnh của bạn.</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input class="form-control" id="login-email" type="email" placeholder="ban@email.com" autocomplete="email" required>
          <span class="field-error">Vui lòng nhập email hợp lệ</span>
        </div>
        <div class="form-group">
          <label for="login-password">Mật khẩu</label>
          <input class="form-control" id="login-password" type="password" placeholder="Tối thiểu 6 ký tự" autocomplete="current-password" required>
          <span class="field-error">Mật khẩu phải có ít nhất 6 ký tự</span>
        </div>
        <div class="form-row" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.4rem">
          <label class="checkbox-wrap"><input type="checkbox" checked> Ghi nhớ tôi</label>
          <a href="#" id="link-forgot" style="color:var(--cyan);font-size:.88rem">Quên mật khẩu?</a>
        </div>
        <button class="btn btn-primary btn-lg" type="submit" style="width:100%"><i class="fa-solid fa-right-to-bracket"></i> Đăng nhập</button>
      </form>

      <div class="auth-divider"><span>hoặc</span></div>
      <button class="btn btn-glass btn-lg" id="btn-google" style="width:100%"><i class="fa-brands fa-google"></i> Tiếp tục với Google</button>

      <p style="text-align:center;margin-top:1.6rem;color:var(--text-3);font-size:.88rem">
        Đây là trang demo — mật khẩu <strong>không</strong> được lưu trữ hay gửi đi bất cứ đâu.
      </p>
    </div>
  </main>

  <script src="assets/js/movies.js"></script>
  <script src="assets/js/watchlist.js"></script>
  <script src="assets/js/history.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/search.js"></script>
</body>
</html>
